<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Consultant Times — business news through a consultant's lens</title>
<meta name="description" content="Daily business, deals and AI news for consultants and consulting students, with what each story means for client work.">
<meta property="og:title" content="The Consultant Times">
<meta property="og:description" content="Business news through a consultant's lens. New edition every weekday at 6am PT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E7;--ink:#141414;--muted:#5C5C5C;--rule:#C9C1B0;--tint:#EDE5D3;--red:#E8462E;--teal:#00747A;--van:#1F5F4A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
a{color:inherit}
button{font-family:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
.serif{font-family:'Fraunces',Georgia,serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.kick{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.badge{border:1px solid var(--muted);padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.new{margin-left:8px;background:var(--red);color:#fff;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hl{background:var(--red);color:#fff;padding:0 10px;font-style:italic;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sec{padding:28px 0;border-bottom:1px solid var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.sec-h h2{font-family:'Fraunces',serif;font-weight:900;font-size:30px;margin:0}
.sec-h p{font-size:15px;color:var(--muted);margin:4px 0 0}
.row{display:flex;flex-wrap:wrap}
.linkbtn{background:transparent;border:0;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:4px;min-height:40px;padding:0}
/* nav */
.topbar{background:#000;color:#fff;position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.logo{font-family:'Fraunces',serif;font-weight:900;font-size:22px;letter-spacing:-.02em;white-space:nowrap;text-decoration:none;color:#fff}
.nav{display:flex;flex-wrap:wrap;flex:1 1 auto}
.nav button{min-height:60px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:transparent;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.nav button[aria-pressed=true]{border-bottom-color:#fff}
.burger{display:none;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer}
.panel{border-top:1px solid #2A2A2A;background:#111;color:#fff}
.panel .wrap{display:block;padding-top:18px;padding-bottom:22px}
.panel .chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid #3A3A3A;background:transparent;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.tab{min-height:40px;padding:0 12px;border:1px solid var(--ink);background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:3px double var(--ink);font-size:13px;min-height:36px}
/* lead */
.lead{flex:2 1 640px;min-width:0;padding-right:32px}
.lead h1{font-family:'Fraunces',serif;font-weight:700;font-size:52px;line-height:1.06;letter-spacing:-.01em;margin:14px 0 18px}
.facts{display:flex;flex-wrap:wrap;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:20px}
.facts div{flex:1 1 140px;min-width:0;padding:10px 14px 10px 0}
.facts .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts .v{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;margin-top:3px}
.why li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px;line-height:1.5}
.why .n{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--red)}
.take{border-left:4px solid var(--red);padding:2px 0 2px 18px}
.take p{font-family:'Fraunces',serif;font-size:21px;line-height:1.4;margin:6px 0 0}
.wire{flex:1 1 300px;min-width:0;border-left:1px solid var(--ink);padding-left:28px}
.wire li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.wire .d{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);width:56px;flex:0 0 56px;padding-top:2px}
.card{flex:1 1 300px;min-width:0;border-top:6px solid var(--ink);padding-top:12px;display:flex;flex-direction:column}
.card h3{font-family:'Fraunces',serif;font-weight:700;font-size:25px;line-height:1.15;margin:8px 0 10px;cursor:pointer}
.signal{font-size:15px;line-height:1.5;margin:0 0 12px;background:var(--tint);padding:10px 12px}
/* big moves */
.bm-hero{flex:1 1 420px;min-width:0;background:var(--ink);color:var(--paper);padding:28px}
.bm-val{font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:600;line-height:1;margin:22px 0 4px;color:#FF6B57}
.bm-row{display:flex;gap:18px;align-items:flex-start;padding:16px 0 16px 24px;border-bottom:1px solid var(--rule)}
.bm-row .v{width:110px;flex:0 0 110px}
.grid3{display:flex;flex-wrap:wrap;border-top:2px solid var(--ink)}
.grid3 article{flex:1 1 300px;min-width:0;padding:16px 20px 16px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.grid3 h3{font-family:'Fraunces',serif;font-weight:700;font-size:20px;line-height:1.22;margin:0}
.jobs{flex:1 1 300px;min-width:0;background:var(--van);color:#fff;padding:22px}
.case{background:var(--ink);color:var(--paper);padding:22px 26px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
/* article */
.art{max-width:760px;margin:0 auto;padding:28px 0 40px}
.art h1{font-family:'Fraunces',serif;font-weight:700;font-size:46px;line-height:1.08;margin:14px 0 12px}
.art p.body{font-size:18px;line-height:1.75;margin:0 0 18px}
.page{max-width:760px;margin:0 auto;padding:28px 0 40px;font-size:17px;line-height:1.7}
.page h1{font-family:'Fraunces',serif;font-size:42px;line-height:1.1}
.page h2{font-family:'Fraunces',serif;font-size:26px;margin-top:32px}
footer{padding:28px 0 48px;display:flex;flex-wrap:wrap;gap:32px;font-size:14px;line-height:1.6}
footer > div{flex:1 1 220px}
.muted{color:var(--muted)}
.notice{background:var(--tint);padding:16px 20px;margin:20px 0;font-size:15px}
/* newspaper look */
.masthead{background:var(--paper);text-align:center;padding:14px 0 10px;border-bottom:1px solid var(--ink)}
.mh-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:0 0 8px;border-bottom:1px solid var(--ink);margin-bottom:8px}
.mh-title{display:block;font-weight:900;font-size:84px;line-height:1;letter-spacing:-.025em;text-decoration:none;color:var(--ink);padding:6px 0}
.mh-tag{font-family:'Fraunces',serif;font-style:italic;font-size:16px;color:var(--muted);padding:2px 0 6px;border-top:3px double var(--ink);margin-top:6px;padding-top:8px}
.topbar .logo{display:none}
.card + .card{border-left:1px solid var(--rule);padding-left:24px}
.dropcap::first-letter{float:left;font-family:'Fraunces',serif;font-weight:900;font-size:4.6em;line-height:.8;padding:8px 10px 0 0}
.byline{font-size:13px;color:var(--muted);padding:10px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:22px;text-transform:uppercase;letter-spacing:.06em}
/* category pages */
.lead.sm h1{font-size:44px}
.side{flex:1 1 300px;min-width:0;border-left:1px solid var(--ink);padding-left:28px}
.side article{padding:14px 0;border-top:1px solid var(--rule);margin-top:6px}
.band{color:#fff;padding:34px 40px;margin:0 -40px;border-bottom:3px double var(--paper)}
.band h1{font-weight:900;font-size:56px;line-height:1.02;margin:8px 0 8px;letter-spacing:-.01em}
.band p{margin:0;font-size:17px;opacity:.85;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px;border-top:2px solid var(--ink)}
.mini{min-width:0;padding:16px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.mini h3{font-weight:700;font-size:20px;line-height:1.22;margin:0}
.mini p{font-size:14px;line-height:1.5;margin:0}
.mini p.cs{background:var(--tint);padding:8px 10px}
.tiles,.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.score{grid-template-columns:1fr 1fr}
.jobs{align-self:flex-start}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;text-decoration:none;min-width:0}
.tv{font-size:34px;font-weight:600;line-height:1;color:#FF6B57}
.tbl{border-top:2px solid var(--ink)}
.tr{display:grid;grid-template-columns:96px 1fr 150px 80px;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:start}
.tr.th{padding:8px 0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip2{display:inline-block;color:#fff;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:820px){
 .mh-title{font-size:38px}.mh-row span:nth-child(2){display:none}.topbar .logo{display:none}.card + .card{border-left:0;padding-left:0}.mh-tag{font-size:13px}
 .side{border-left:0;padding-left:0;border-top:1px solid var(--ink);margin-top:24px;padding-top:16px}.lead.sm h1{font-size:32px}.band{padding:24px 20px;margin:0 -20px}.band h1{font-size:38px}.tr{grid-template-columns:1fr;gap:6px}.tr.th{display:none}.tr .mono{text-align:left!important}
 .nav{display:none}.burger{display:block}
 .wrap{padding-left:20px;padding-right:20px}
 .lead{padding-right:0}.lead h1{font-size:36px}
 .wire{border-left:0;padding-left:0;border-top:1px solid var(--ink);margin-top:24px;padding-top:16px}
 .bm-row{padding-left:0}.bm-val{font-size:48px}.art h1{font-size:34px}
}
@media print{.topbar,.panel{display:none}}
</style>
</head>
<body>
<header class="masthead"><div class="wrap">
 <div class="mh-row mono"><span>Vancouver, B.C.</span><span>Est. 2026</span><span>Monday to Friday · 6:00 AM PT</span></div>
 <a class="mh-title serif" href="#">The Consultant Times</a>
 <div class="mh-tag">Business news through a consultant's lens</div>
</div></header>
<div class="topbar" id="top">
 <div class="wrap">
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
  <a class="logo" href="#">The Consultant Times</a>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
 </div>
 <div id="panel"></div>
</div>
<div class="wrap">
 <div class="dateline"><span class="mono" id="dateline"></span><span id="filterbar"></span></div>
 <main id="main"><p class="notice">Loading today's edition…</p></main>
 <footer id="footer"></footer>
</div>
<script>
"use strict";
const SITE = { name: "The Consultant Times", founder: "Thomson Le", formUrl: "https://docs.google.com/forms/d/e/1FAIpQLSfo1_S7TEHVEtA4acb5jJ0IMoUhgYiQcoDcwr9MFqbnnmq6_A/viewform", tz: "America/Vancouver" };
const FIRMS = ["McKinsey","BCG","Bain","Deloitte","EY","PwC","KPMG","Accenture","Industry"];
const DESKS = ["Tech & AI","Financial services","Energy & resources","Consumer & retail","Health","Industrials & logistics","Media & telecom","Public sector","Consulting industry"];
const SECTIONS = ["Latest","AI & Tools","Big Moves","Vancouver","How It Works"];
const KC = { "Deals":"#C70000","Big Moves":"#C70000","Research":"#005689","Models":"#C05A00","Tools":"#C05A00","Workforce":"#7D0068","Strategy":"#3D5A80","Regulation":"#3D5A80" };
const MC = { "M&A":"#005689", "IPO":"#1F8A4C", "Scandal":"#C70000", "Funding":"#7D0068", "Canada":"#C05A00", "Earnings":"#3D5A80", "Leadership":"#3D5A80" };
const st = { data:null, lib:[], view:"Latest", firm:"All", desk:"All", menu:null, moveType:"All" };

// ---------- helpers ----------
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => /^https:\/\//i.test(String(u || "")) ? esc(u) : "#";
const arr = (x) => Array.isArray(x) ? x : [];
const kc = (k) => KC[k] || "#3D5A80";
function srcLine(s){ return s && s.url ? `<span class="badge">${esc(s.stype||s.type||"Source")}</span> <a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(s.src||s.name||"Source")}</a>` : ""; }
function when(s){ return esc(s.date || "") + (s.time ? " · " + esc(s.time) : ""); }
function storyMatches(s){ return (st.firm==="All" || s.firm===st.firm) && (st.desk==="All" || s.desk===st.desk); }

// ---------- data loading with fallback ----------
async function load(){
  const tryGet = async (p) => { const r = await fetch(p + "?v=" + Date.now(), { cache:"no-store" }); if (!r.ok) throw new Error(p); return r.json(); };
  try { st.data = await tryGet("data/edition.json"); }
  catch(e){ try { st.data = await tryGet("data/last-good.json"); st.data._fallback = true; } catch(e2){ st.data = null; } }
  try { const l = await tryGet("data/library.json"); st.lib = arr(l.items); } catch(e){ st.lib = []; }
  render();
}

// ---------- nav ----------
function renderNav(){
  const nav = document.getElementById("nav");
  const btn = (label, pressed, act, chev) => `<button data-act="${esc(act)}" aria-pressed="${pressed}">${esc(label)}${chev ? ' <span style="font-size:11px">▾</span>' : ""}</button>`;
  let h = btn("Latest", st.view==="Latest" && !st.menu && st.firm==="All" && st.desk==="All", "view:Latest");
  h += btn(st.firm==="All" ? "Firms" : st.firm, st.firm!=="All" || st.menu==="firms", "menu:firms", true);
  h += btn(st.desk==="All" ? "Industries" : st.desk, st.desk!=="All" || st.menu==="desks", "menu:desks", true);
  SECTIONS.slice(1).forEach((s) => h += btn(s, st.view===s && !st.menu && st.firm==="All" && st.desk==="All", "view:"+s));
  h += btn("More", st.menu==="more", "menu:more", true);
  nav.innerHTML = h;
  const panel = document.getElementById("panel");
  const chips = (title, items) => `<div class="panel"><div class="wrap"><div class="kick" style="color:#9A9A9A">${esc(title)}</div><div class="chips">${items}</div></div></div>`;
  const chip = (label, on, act) => `<button class="chip" data-act="${esc(act)}" aria-pressed="${on}">${esc(label)}</button>`;
  let p = "";
  if (st.menu==="burger") p += chips("Sections", SECTIONS.map((s)=>chip(s, st.view===s, "view:"+s)).join("") + chip("About","false","page:about") + chip("How we work","false","page:how-we-work"));
  if (st.menu==="firms" || st.menu==="burger") p += chips("Filter by firm", chip("All firms", st.firm==="All", "firm:All") + FIRMS.map((f)=>chip(f==="Industry"?"Industry-wide":f, st.firm===f, "firm:"+f)).join(""));
  if (st.menu==="desks" || st.menu==="burger") p += chips("Industry desks", chip("All industries", st.desk==="All", "desk:All") + DESKS.map((d)=>chip(d, st.desk===d, "desk:"+d)).join(""));
  if (st.menu==="more") p += chips("More", chip("About","false","page:about") + chip("How we work","false","page:how-we-work") + chip("Corrections","false","page:corrections") + chip("Suggestions & feedback","false","page:feedback"));
  panel.innerHTML = p;
  document.getElementById("burger").setAttribute("aria-expanded", st.menu==="burger" ? "true" : "false");
}

// ---------- sections ----------
function leadHTML(s){
  const facts = arr(s.facts).length ? `<div class="facts">${arr(s.facts).map((f)=>`<div><div class="k">${esc(f.k)}</div><div class="v">${esc(f.v)}</div></div>`).join("")}</div>` : "";
  const why = arr(s.why).length ? `<div style="flex:1 1 300px;min-width:0"><div class="kick" style="margin-bottom:8px">Why it matters</div><ol class="why" style="margin:0;padding:0;list-style:none">${arr(s.why).map((t,i)=>`<li><span class="n">0${i+1}</span><span>${esc(t)}</span></li>`).join("")}</ol></div>` : "";
  const take = s.take ? `<div class="take" style="flex:1 1 260px;min-width:0"><div class="kick">Our take</div><p>${esc(s.take)}</p></div>` : "";
  const head = s.hl ? `${esc(s.pre||"")} <span class="hl">${esc(s.hl)}</span> ${esc(s.post||"")}` : esc(s.title);
  return `<div class="lead">
   <div class="kick" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span style="background:${kc(s.kicker)};color:#fff;padding:4px 8px">Lead</span><span style="color:${kc(s.kicker)}">${esc(s.kicker)} · ${esc(s.firm==="Industry"?"Industry-wide":s.firm)}</span><span class="mono muted" style="letter-spacing:0">${when(s)}</span>${s.isNew?'<span class="new">New</span>':""}</div>
   <h1><a href="#story-${esc(s.id)}" style="text-decoration:none">${head}</a></h1>${facts}
   <p style="font-size:19px;line-height:1.65;margin:0 0 20px">${esc(s.summary)}</p>
   <div class="row" style="gap:28px;align-items:flex-start">${why}${take}</div>
   <p class="signal" style="margin-top:18px"><b>Client signal:</b> ${esc(s.cs)}</p>
   <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13px" class="muted">${arr(s.sources).slice(0,1).map(srcLine).join("")}
   <a href="#story-${esc(s.id)}" style="min-height:44px;display:inline-flex;align-items:center;padding:0 18px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;text-decoration:none">Read the full story →</a></div></div>`;
}
function wireHTML(w){
  return `<aside class="wire"><div style="display:flex;align-items:baseline;gap:10px"><h2 class="serif" style="font-weight:900;font-size:26px;margin:0">The Wire</h2><span class="muted" style="font-size:12px">quick hits, newest first</span></div>
  <ol style="list-style:none;margin:10px 0 0;padding:0">${arr(w).map((x)=>`<li><span class="d">${esc(x.date)}</span><span style="min-width:0;font-size:15px;line-height:1.45"><b class="kick" style="font-size:11px;color:${kc(x.tag)}">${esc(x.tag)}</b>${x.isNew?'<span class="new">New</span>':""}<br><a href="#story-${esc(x.id)}" style="text-decoration:none">${esc(x.text)}</a> <a href="${safeUrl(x.url)}" target="_blank" rel="noopener" class="muted" style="font-size:12px">${esc(x.src)}</a></span></li>`).join("") || '<li class="muted">Nothing on the wire yet.</li>'}</ol></aside>`;
}
function cardHTML(s){
  return `<article class="card" style="border-top-color:${kc(s.kicker)}">
   <div class="kick" style="color:${kc(s.kicker)}">${esc(s.kicker)} · ${esc(s.firm==="Industry"?"Industry-wide":s.firm)}${s.isNew?'<span class="new">New</span>':""}</div>
   <h3><a href="#story-${esc(s.id)}" style="text-decoration:none">${esc(s.title)}</a></h3>
   <p style="font-size:15px;line-height:1.6;margin:0 0 10px">${esc(s.summary)}</p>
   <p class="signal"><b>Client signal:</b> ${esc(s.cs)}</p>
   <div style="margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13px" class="muted"><span>${when(s)} · ${arr(s.sources).slice(0,1).map(srcLine).join("")}</span><a href="#story-${esc(s.id)}" style="font-weight:700;color:var(--ink)">Read →</a></div></article>`;
}
function bigMovesHTML(d){
  const types = ["All","M&A","IPO","Scandal","Funding","Earnings","Leadership","Canada"].filter((t)=>t==="All" || arr(d.bigMoves).some((m)=>m.type===t));
  let list = arr(d.bigMoves).filter((m)=>(st.moveType==="All" || m.type===st.moveType) && storyMatches(m));
  if (!list.length) list = arr(d.bigMoves);
  if (!list.length) return "";
  const h = list[0], rest = list.slice(1);
  return `<section class="sec"><div class="sec-h"><div><h2>Big Moves</h2><p>Deals, listings, shake-ups and scandals, with what each one means for client work.</p></div>
   <div style="display:flex;flex-wrap:wrap;gap:6px">${types.map((t)=>`<button class="tab" data-act="move:${esc(t)}" aria-pressed="${st.moveType===t}">${esc(t)}</button>`).join("")}</div></div>
   <div class="row" style="border-top:2px solid var(--ink)">

const MON = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
const KIND_RANK = { story:0, move:1, how:2, van:3, radar:4, wire:5 };
const AIRX = /\bAI\b|artificial intelligence|Anthropic|OpenAI|Nvidia|Cohere|Mercor|\bmodels?\b|agentic|semiconductor|\bchips?\b|Marvell|Lumentum|Salesforce|Shield AI/i;
function dkey(x){
  const m = String(x.date || "").trim().toLowerCase().match(/^([a-z]{3})[a-z]*\.?\s*(\d{1,2})?/);
  if (!m || !MON[m[1]]) return 0;
  const k = MON[m[1]] * 100 + (m[2] ? +m[2] : 0), n = new Date(), today = (n.getMonth() + 1) * 100 + n.getDate();
  return k > today ? 0.5 : k;
}
function sortNew(a){ return a.slice().sort((p, q) => (dkey(q) - dkey(p)) || ((KIND_RANK[p.kind] || 0) - (KIND_RANK[q.kind] || 0))); }
function poolOf(d){
  const mk = (x, kind) => Object.assign({}, x, {
    kind, title: x.title || x.text || "",
    blurb: x.summary || x.body || (kind === "wire" ? "" : (x.cs || "")),
    label: x.kicker || (kind === "move" ? x.type : kind === "van" || kind === "wire" ? x.tag : kind === "radar" ? "Under the Radar" : "How it works"),
    where: kind === "move" ? (x.co || "") : kind === "van" ? "Vancouver" : (x.firm === "Industry" ? "" : (x.firm || "")) });
  return [].concat(arr(d.stories).map((x) => mk(x, "story")), arr(d.bigMoves).map((x) => mk(x, "move")), arr(d.radar).map((x) => mk(x, "radar")),
    arr((d.vancouver || {}).stories).map((x) => mk(x, "van")), arr(d.wire).map((x) => mk(x, "wire")), arr(d.howItWorks).map((x) => mk(x, "how")), arr(st.lib).map((x) => Object.assign(mk(x, "how"), { archived: true })));
}
const colOf = (x) => x.kind === "move" ? (MC[x.type] || "#3D5A80") : x.kind === "van" ? "var(--van)" : x.kind === "how" ? "var(--teal)" : kc(x.kicker || x.tag);
const headOf = (x) => `<div class="kick" style="font-size:11px;color:${colOf(x)}">${esc(x.label)}${x.where ? " · " + esc(x.where) : ""} · <span class="mono muted" style="letter-spacing:0;font-weight:500">${esc(x.date || "")}</span>${x.isNew ? '<span class="new">New</span>' : ""}</div>`;
const linkOf = (x) => `<a href="#story-${esc(x.id)}" style="text-decoration:none">${esc(x.title)}</a>`;
const srcOne = (x) => { const s = arr(x.sources)[0] || (x.url ? { stype: x.stype, src: x.src, url: x.url } : null); return s ? srcLine(s) : ""; };

  return `${pageBand("The Vancouver Desk", "B.C. business, deals and careers that Vancouver consultants and consulting students should know.", "var(--van)", "LOCAL · VANCOUVER")}
  <section class="row" style="gap:0;padding:28px 0;border-bottom:1px solid var(--ink)">
   <div style="flex:2 1 560px;min-width:0;padding-right:32px">${lead ? `<div class="kick" style="color:var(--van)">${esc(lead.label)} · ${esc(lead.date)}</div>${lead.num || lead.value ? `<div class="mono" style="font-size:56px;font-weight:600;color:var(--van);line-height:1;margin:12px 0 6px">${esc(lead.num || lead.value)}</div>` : ""}<h2 class="serif" style="font-weight:700;font-size:38px;line-height:1.1;margin:8px 0 14px">${linkOf(lead)}</h2>${lead.blurb ? `<p style="font-size:18px;line-height:1.65;margin:0 0 14px">${esc(lead.blurb)}</p>` : ""}<div class="muted" style="font-size:13px">${srcOne(lead)} &nbsp; <a href="#story-${esc(lead.id)}" style="font-weight:700;color:var(--ink)">Read the full story →</a></div>` : ""}
    ${rest.length ? `<div class="grid" style="margin-top:28px;border-top-color:var(--van)">${rest.map((x) => mini(x, { cs: true })).join("")}</div>` : ""}</div>
   <div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:24px">
    <aside class="jobs"><div class="kick" style="font-size:11px;color:#BFE3D3">Careers board · Vancouver</div>${jobs.map((j) => `<div style="padding:14px 0;border-bottom:1px solid #3C7A64"><div class="serif" style="font-weight:700;font-size:19px;line-height:1.25">${esc(j.role)}</div><div style="font-size:14px;margin-top:4px">${esc(j.firm)} · ${esc(j.start)}</div><div class="mono" style="font-size:14px;font-weight:600;margin-top:4px;color:#FFD166">${esc(j.pay)}</div>${j.closes ? `<div style="font-size:12px;color:#BFE3D3">Apply by ${esc(j.closes)}</div>` : ""}<a href="${safeUrl(j.url)}" target="_blank" rel="noopener" style="font-size:13px;color:#BFE3D3">View posting →</a></div>`).join("") || '<p style="font-size:14px">No open roles listed right now.</p>'}<div style="font-size:12px;color:#BFE3D3;margin-top:12px;line-height:1.5">Consulting roles, internships and case competitions in Vancouver. Checked every edition; expired postings are removed.</div></aside>
    <aside style="border:1px solid var(--van);padding:18px 20px"><div class="kick" style="color:var(--van);margin-bottom:6px">Vancouver by the numbers</div>${L.filter((x) => x.num || x.value).map((x) => `<div style="padding:9px 0;border-top:1px solid var(--rule)"><div class="mono" style="font-size:20px;font-weight:600;color:var(--van)">${esc(x.num || x.value)}</div><div style="font-size:13px;line-height:1.4">${linkOf(x)}</div></div>`).join("")}</aside></div></section>`;
}

// How It Works: today's three deep dives + the library
function howPage(d){
  const today = arr(d.howItWorks).map((e) => Object.assign({}, e, { label: "How it works" }));
  if (!today.length) return noneHTML("How It Works");
  const f = today[0], two = today.slice(1), lib = arr(st.lib);
  const side = (e) => `<article style="padding:16px 0;border-top:1px solid var(--rule)"><div class="kick" style="color:var(--teal)">${esc(e.sector)} · <span class="mono muted" style="letter-spacing:0;font-weight:500">${esc(e.readTime || "")}</span></div><h3 class="serif" style="font-weight:700;font-size:26px;line-height:1.15;margin:6px 0 8px"><a href="#story-${esc(e.id)}" style="text-decoration:none">${esc(e.title)}</a></h3><p style="font-size:15px;line-height:1.55;margin:0 0 10px">${esc(e.body)}</p><div style="background:var(--tint);padding:10px 12px;font-size:14px;line-height:1.4"><b>Try the case:</b> ${esc(e.caseq)}</div><div style="margin-top:10px;font-size:13px"><a href="#story-${esc(e.id)}" style="font-weight:700">Read the deep dive →</a></div></article>`;
  return `${pageBand("How It Works", "One business, taken apart like a consultant would. Three new deep dives every weekday: business acumen and case-interview practice.", "var(--teal)", "THE SERIES · TODAY'S THREE")}
  <section class="row" style="gap:0;padding:28px 0;border-bottom:1px solid var(--ink);align-items:flex-start">
   <div style="flex:2 1 520px;min-width:0;padding-right:32px"><div class="kick" style="color:var(--teal)">Deep dive 1 of ${today.length} · ${esc(f.sector)}</div><h2 class="serif" style="font-weight:700;font-size:44px;line-height:1.08;margin:10px 0 14px"><a href="#story-${esc(f.id)}" style="text-decoration:none">${esc(f.title)}</a></h2><p style="font-size:19px;line-height:1.65;margin:0 0 14px">${esc(f.body)}</p>${f.ai ? `<p style="font-size:16px;line-height:1.55;margin:0 0 18px"><b>Where AI hits:</b> ${esc(f.ai)}</p>` : ""}
    ${arr(f.facts).length ? `<div class="facts">${arr(f.facts).map((q) => `<div><div class="k">${esc(q.k)}</div><div class="v">${esc(q.v)}</div></div>`).join("")}</div>` : ""}
    ${f.caseq ? `<div style="background:var(--ink);color:var(--paper);padding:18px 20px;margin:0 0 18px"><div class="kick" style="color:#FFD166">Try the case</div><p class="serif" style="font-size:20px;line-height:1.4;margin:6px 0 0">${esc(f.caseq)}</p></div>` : ""}
    <a href="#story-${esc(f.id)}" style="min-height:48px;display:inline-flex;align-items:center;padding:0 24px;background:var(--ink);color:var(--paper);font-weight:700;text-decoration:none">Read the deep dive →</a></div>
   <div class="side"><div class="kick" style="margin-bottom:4px">Also today</div>${two.map(side).join("")}</div></section>
  <section class="sec"><div class="sec-h"><div><h2>The library</h2><p>${lib.length ? "Every earlier deep dive, newest first." : "Every deep dive is kept here once it leaves today's three."}</p></div></div>${lib.length ? `<div class="grid">${lib.map((e) => `<article class="mini" style="border-top:4px solid var(--teal);padding-top:10px"><div class="kick" style="font-size:11px;color:var(--teal)">${esc(e.sector)} · <span class="mono muted" style="letter-spacing:0;font-weight:500">${esc(e.date || "")}</span></div><h3 class="serif">${linkOf(Object.assign({}, e))}</h3><p>${esc(e.body)}</p></article>`).join("")}</div>` : `<p class="notice">The library fills up from tomorrow.</p>`}</section>
  <section class="notice" style="margin:24px 0"><b>Which business should we take apart next?</b> Tell us a company or industry and it may become a deep dive. <a href="${safeUrl(SITE.formUrl)}" target="_blank" rel="noopener" style="font-weight:700">Suggest one →</a></section>`;
}

// Firm page: newsroom stream for one firm + elsewhere in consulting
function firmPage(d, firm){
  const P = sortNew(poolOf(d).filter((x) => x.kind !== "how")), name = firm === "Industry" ? "Industry-wide" : firm;
  const has = (x) => firm === "Industry" ? x.firm === "Industry" : (x.firm === firm || new RegExp("\\b" + firm.replace(/[^a-z0-9]/gi, "") + "\\b", "i").test(x.title + " " + x.blurb + " " + (x.co || "")));
  const m = P.filter(has), other = P.filter((x) => !has(x) && (x.desk === "Consulting industry" || x.tag === "Firms" || FIRMS.some((f) => f !== "Industry" && new RegExp("\\b" + f + "\\b").test(x.title)))).slice(0, 6);
  const fill = m.length ? [] : P.slice(0, 6);
  return `${pageBand(name, m.length ? m.length + (m.length === 1 ? " story" : " stories") + " in this edition" : "Nothing new on " + name + " in this edition", "#000", "FIRM DESK")}
  <section class="row" style="gap:0;padding:28px 0;border-bottom:1px solid var(--ink)">
   <div style="flex:2 1 560px;min-width:0;padding-right:32px">${m.length ? m.map((x) => `<article style="display:flex;gap:18px;padding:18px 0;border-top:1px solid var(--rule)"><div class="mono muted" style="width:60px;flex:0 0 60px;font-size:12px;padding-top:4px">${esc(x.date)}</div><div style="min-width:0">${headOf(x)}<h2 class="serif" style="font-weight:700;font-size:28px;line-height:1.15;margin:6px 0 8px">${linkOf(x)}</h2>${x.blurb ? `<p style="font-size:16px;line-height:1.6;margin:0 0 8px">${esc(x.blurb)}</p>` : ""}${x.cs ? `<p class="signal"><b>Client signal:</b> ${esc(x.cs)}</p>` : ""}<div class="muted" style="font-size:12px">${srcOne(x)}</div></div></article>`).join("") : `<p class="notice" style="margin-top:0">We haven't covered ${esc(name)} in this edition. Here is the latest from across the site.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${fill.map((x) => mini(x)).join("")}</div>`}</div>
   ${sideList("Elsewhere in consulting", "firms and the industry", other)}</section>`;
}

// Industry desk page: magazine layout (featured + stream + related)
function deskPage(d, desk){
  const P = sortNew(poolOf(d).filter((x) => x.kind !== "how")), m = P.filter((x) => x.desk === desk), others = P.filter((x) => x.desk !== desk);
  const list = m.length ? m : [];
  const f = list.find((x) => x.kind === "story" || x.kind === "move") || list[0];
  const rest = list.filter((x) => x !== f);
  return `${pageBand(desk, list.length ? list.length + (list.length === 1 ? " story" : " stories") + " on this desk" : "Nothing new on this desk in this edition", "#1B2A41", "INDUSTRY DESK")}
  ${f ? `<section class="row" style="gap:0;padding:28px 0;border-bottom:1px solid var(--ink)">${bigLead(f, "font-size:40px")}${sideList("Also on this desk", desk, rest.slice(0, 4))}</section>` : `<p class="notice">We haven't covered ${esc(desk)} in this edition. Here is the latest from across the site.</p>`}
  <section class="sec"><div class="sec-h"><div><h2>${f ? "Elsewhere on the site" : "Latest from across the site"}</h2><p>More headlines, newest first.</p></div></div><div class="grid">${others.slice(0, 8).map((x) => mini(x)).join("")}</div></section>`;
}
function noneHTML(name){ return `<p class="notice">Nothing in ${esc(name)} yet. Check back at the next edition.</p>`; }

// ---------- pages ----------
function home(d){
  let h = "";
  if (st.firm !== "All") h = firmPage(d, st.firm);
  else if (st.desk !== "All") h = deskPage(d, st.desk);
  else if (st.view === "AI & Tools") h = aiPage(d);
  else if (st.view === "Big Moves") h = movesPage(d);
  else if (st.view === "Vancouver") h = vanPage(d);
  else if (st.view === "How It Works") h = howPage(d);
  else {
    const stories = arr(d.stories), lead = stories.find((s)=>s.id===d.lead) || stories[0];
    const cards = stories.filter((s)=>s!==lead).slice(0,3);
    if (lead) h += `<section class="row" style="padding:28px 0;border-bottom:1px solid var(--ink)">${leadHTML(lead)}${wireHTML(d.wire)}</section>
      <section class="row" style="gap:24px;padding:28px 0;border-bottom:1px solid var(--ink)">${cards.map(cardHTML).join("")}</section>${caseHTML(d)}`;
    h += bigMovesHTML(d) + radarHTML(d) + vanHTML(d) + howHTML(d);
  }
  h += feedbackHTML();
  const fb = document.getElementById("filterbar");
  const filtered = st.view!=="Latest" || st.firm!=="All" || st.desk!=="All";
  const where = st.firm!=="All" ? (st.firm==="Industry"?"Industry-wide":st.firm) : st.desk!=="All" ? st.desk : st.view;
  fb.innerHTML = filtered ? `<span style="display:inline-flex;align-items:center;gap:10px"><b class="kick">${esc(where)}</b><button class="tab" data-act="reset">Back to front page ✕</button></span>` : "";
  return h;
}
function articlePage(d, id){
  const norm = (x, kind) => Object.assign({}, x, {
    kicker: x.kicker || (kind==="move" ? x.type : kind==="radar" ? "Under the Radar" : kind==="van" ? "Vancouver · " + (x.tag||"") : kind==="wire" ? (x.tag||"Wire") : "How It Works"),
    firm: x.firm || x.co || (kind==="van" ? "Vancouver" : ""),
    title: x.title || x.text,
    summary: x.summary || x.body || (kind==="wire" ? x.text : ""),
    sources: arr(x.sources).length ? x.sources : (x.url ? [{ stype: x.stype || "Source", src: x.src, url: x.url }] : []) });
  const pool = arr(d.stories).map((x)=>norm(x,"story")).concat(arr(d.archive).map((x)=>norm(x,"story")), arr(d.bigMoves).map((x)=>norm(x,"move")), arr(d.radar).map((x)=>norm(x,"radar")), arr((d.vancouver||{}).stories).map((x)=>norm(x,"van")), arr(d.wire).map((x)=>norm(x,"wire")), arr(d.howItWorks).map((x)=>norm(x,"how")), arr(st.lib).map((x)=>norm(x,"how")));
  const s = pool.find((x)=>x.id===id);
  if (!s) return `<div class="art"><a href="#">← Back to the front page</a><h1>Story not found</h1><p>It may have moved to the archive.</p></div>`;
  const facts = arr(s.facts).length ? `<div class="facts">${arr(s.facts).map((f)=>`<div><div class="k">${esc(f.k)}</div><div class="v">${esc(f.v)}</div></div>`).join("")}</div>` : "";
  const paras = arr(s.paras);
  const related = arr(d.stories).filter((x)=>x.id!==s.id).slice(0,3);
  document.title = s.title + " — The Consultant Times";
  return `<article class="art"><a href="#" style="font-weight:700;font-size:14px">← Back to the front page</a>
   <div class="kick" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px"><span style="color:${kc(s.kicker)}">${esc(s.kicker)} · ${esc(s.firm==="Industry"?"Industry-wide":s.firm)}</span><span style="background:var(--ink);color:var(--paper);padding:3px 8px">${esc(s.confidence||"Reported")}</span>${s.updated?`<span class="mono muted" style="letter-spacing:0">Updated ${esc(s.updated)}</span>`:""}</div>
   <h1>${esc(s.title)}</h1><p class="serif" style="font-size:21px;line-height:1.45;color:#44403C;margin:0 0 16px">${esc(s.summary)}</p>
   <div class="byline">By The Consultant Times · AI-assisted · ${when(s)} ${esc(s.year||"")} ${s.readTime?"· "+esc(s.readTime):""}</div>
   ${facts}${arr(s.sections).map((sec,si)=>`<h2 class="serif" style="font-size:28px;margin:30px 0 10px">${esc(sec.h)}</h2>${arr(sec.paras).map((p,pi)=>`<p class="body${(si===0&&pi===0)?" dropcap":""}">${esc(p)}</p>`).join("")}`).join("")}
   ${s.caseq?`<div style="background:var(--ink);color:var(--paper);padding:20px 22px;margin:26px 0"><div class="kick" style="color:#FFD166">Try the case</div><p class="serif" style="font-size:21px;line-height:1.4;margin:8px 0 12px">${esc(s.caseq)}</p>${s.caseAnswer?`<details><summary style="cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center">Show a model answer</summary><p style="font-size:16px;line-height:1.65;margin:8px 0 0">${esc(s.caseAnswer)}</p></details>`:""}</div>`:""}
   ${arr(s.cheat).length?`<div class="notice" style="border:2px solid var(--ink)"><div class="kick" style="margin-bottom:8px">Cheat sheet</div>${arr(s.cheat).map((c)=>`<div style="padding:5px 0;border-top:1px solid var(--rule)">${esc(c)}</div>`).join("")}</div>`:""}
   ${arr(s.sections).length ? "" : paras.length ? paras.map((p)=>`<p class="body">${esc(p)}</p>`).join("") : `<p class="muted" style="font-size:14px">This is a short brief. For the full details, see the original source below.</p>`}
   ${arr(s.unknowns).length?`<div class="notice"><div class="kick" style="margin-bottom:8px">What we don't know yet</div>${arr(s.unknowns).map((u)=>`<div style="padding:4px 0">— ${esc(u)}</div>`).join("")}</div>`:""}
   ${arr(s.why).length?`<div class="kick" style="margin:20px 0 8px">Why it matters</div><ol class="why" style="margin:0;padding:0;list-style:none">${arr(s.why).map((t,i)=>`<li><span class="n">0${i+1}</span><span>${esc(t)}</span></li>`).join("")}</ol>`:""}
   ${s.cs?`<p style="font-size:16px;line-height:1.55;margin:20px 0;background:var(--ink);color:var(--paper);padding:16px 18px"><b style="color:#FF6B57">Client signal:</b> ${esc(s.cs)}</p>`:""}
   ${s.take?`<div class="take" style="margin:0 0 26px"><div class="kick">Our take</div><p>${esc(s.take)}</p></div>`:""}
   <div class="kick" style="margin-bottom:6px">Sources</div><ol style="margin:0 0 28px;padding-left:20px;font-size:14px;line-height:1.8">${arr(s.sources).map((so)=>`<li>${srcLine(so)}</li>`).join("")}</ol>
   ${related.length?`<div class="kick" style="margin-bottom:6px">Related</div>${related.map((r)=>`<a href="#story-${esc(r.id)}" class="serif" style="display:block;padding:10px 0;border-top:1px solid var(--rule);font-size:18px;font-weight:700;text-decoration:none">${esc(r.title)} →</a>`).join("")}`:""}</article>`;
}
function staticPage(name, d){
  const back = `<a href="#" style="font-weight:700;font-size:14px">← Back to the front page</a>`;
  if (name==="about") return `<div class="page">${back}<h1>About The Consultant Times</h1>
   <p>The Consultant Times covers business news through a consultant's lens. Every story answers one question: does this create client work, change an industry's economics, or change how consulting itself works?</p>
   <p>It's written for everyone from partners to first-year students: senior enough to be useful, clear enough to learn from.</p>
   <p>${SITE.founder ? "The Consultant Times was founded by " + esc(SITE.founder) + ", a Business Information Technology Management student at BCIT in Vancouver." : "The Consultant Times is published from Vancouver, B.C."}</p>
   <h2>How it's made</h2><p>Editions are researched, written and fact-checked with AI under the published rules on our <a href="#how-we-work">How we work</a> page, with human oversight for sensitive stories. We say this openly because how a newsroom works should never be hidden.</p></div>`;
  if (name==="how-we-work") return `<div class="page">${back}<h1>How we work</h1>
   <h2>What makes the front page</h2><p>Each item is judged on two things: how much attention it's getting (coverage speed, outlet tier, market reaction, company size, how many industries it touches) and how relevant it is to consulting work. The lead is the strongest story of the last 24 hours. Quiet but important stories go to Under the Radar.</p>
   <h2>Sourcing</h2><p>We prefer original sources (company releases, filings, regulators), then major news outlets, then trade press. Every item links its source and labels its type. Numbers are never published without a source; estimates are marked as estimates.</p>
   <h2>Confidence labels</h2><p><b>Confirmed</b>: from an official source. <b>Reported</b>: from news reporting. <b>Developing</b>: early or single-source, may change.</p>
   <h2>Sensitive stories</h2><p>Allegations are reported as allegations. Stories about an individual's conduct require at least two major outlets and include the response of the person or company. They are reviewed by a human before publishing.</p>
   <h2>Fact-checking</h2><p>Every edition is checked by a separate review pass that compares each fact against its source before publishing. If something is wrong, we correct it in the next edition and log it on the <a href="#corrections">corrections page</a>.</p>
   <h2>Copyright</h2><p>We summarise in our own words and link to the original. We don't reproduce articles, and we only use images with a clear licence, credited.</p>
   <h2>Opinion</h2><p>Opinion appears only in sections labelled "Our take". Nothing on this site is financial advice.</p></div>`;
  if (name==="corrections") { const c = arr(d && d.corrections); return `<div class="page">${back}<h1>Corrections</h1>${c.length ? c.map((x)=>`<p><b>${esc(x.date)}</b>: ${esc(x.text)}</p>`).join("") : "<p>No corrections yet. If you spot an error, please <a href='#feedback'>tell us</a>.</p>"}</div>`; }
  return "";
}

// ---------- render + routing ----------
function render(){
  renderNav();
  const d = st.data; const main = document.getElementById("main");
  document.getElementById("footer").innerHTML = footerHTML();
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!d) { main.innerHTML = `<p class="notice">Today's edition couldn't load. Please refresh in a minute.</p>` + (["about","how-we-work","corrections"].includes(hash) ? staticPage(hash, null) : ""); return; }
  const ed = d.edition || {};
  document.getElementById("dateline").textContent = (ed.label || "") + (ed.next ? " · NEXT EDITION " + ed.next : "") + (d._fallback ? " · SHOWING PREVIOUS EDITION" : "");
  document.title = "The Consultant Times — business news through a consultant's lens";
  if (hash.startsWith("story-")) main.innerHTML = articlePage(d, hash.slice(6));
  else if (["about","how-we-work","corrections"].includes(hash)) main.innerHTML = staticPage(hash, d);
  else { main.innerHTML = home(d); if (hash==="feedback") { const f=document.getElementById("feedback"); if (f) f.scrollIntoView(); } }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const [k, v] = b.getAttribute("data-act").split(/:(.*)/s);
  if (k==="menu") st.menu = st.menu===v ? null : v;
  else if (k==="view") { st.view = v; st.firm = "All"; st.desk = "All"; st.menu = null; if (location.hash) history.pushState("", "", location.pathname); }
  else if (k==="firm") { st.firm = v; st.desk = "All"; st.view = "Latest"; st.menu = null; if (location.hash) history.pushState("", "", location.pathname); }
  else if (k==="desk") { st.desk = v; st.firm = "All"; st.view = "Latest"; st.menu = null; if (location.hash) history.pushState("", "", location.pathname); }
  else if (k==="move") st.moveType = v;
  else if (k==="page") { st.menu = null; location.hash = v; return; }
  else if (k==="reset") { st.firm="All"; st.desk="All"; st.view="Latest"; }
  render();
  if (["view","firm","desk","reset"].includes(k)) window.scrollTo(0,0);
});
document.getElementById("burger").addEventListener("click", () => { st.menu = st.menu==="burger" ? null : "burger"; render(); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
load();
</script>
